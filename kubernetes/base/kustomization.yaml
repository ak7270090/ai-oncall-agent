apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop

labels:
  - pairs:
      app.kubernetes.io/part-of: shop
    includeSelectors: false
    includeTemplates: true

resources:
  - namespace.yaml
  - configmaps/order-service.yaml
  - configmaps/payment-service.yaml
  - deployments/user-service.yaml
  - deployments/payment-service.yaml
  - deployments/order-service.yaml
  - deployments/traffic-generator.yaml
  - deployments/payments-db.yaml
  - services/user-service.yaml
  - services/payment-service.yaml
  - services/order-service.yaml
  - rbac/mcp-server.yaml
  - rbac/mcp-operator.yaml
  - rbac/prometheus.yaml

secretGenerator:
  - name: payment-service-secrets
    envs:
      - secrets/payment-service.env
  - name: payments-db-secrets
    envs:
      - secrets/payments-db.env
