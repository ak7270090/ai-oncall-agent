# Identity for the MCP server's write tools (Phase 18): restart, scale and roll back
# Deployments in this namespace, nothing else. Separate from the read-only `mcp-server`
# account, so investigations never run with write permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-operator
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-operator
subjects:
  - kind: ServiceAccount
    name: mcp-operator
