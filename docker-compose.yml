name: ai-oncall-agent

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      MCP_ALLOWED_HOSTS: '["mcp-server:*", "localhost:*", "127.0.0.1:*"]'
    ports:
      - "127.0.0.1:${MCP_PORT:-9000}:9000"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]

  ai-server:
    build: ./ai-server
    restart: unless-stopped
    env_file: ./ai-server/.env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      MCP_SERVER_URL: http://mcp-server:9000/mcp
    ports:
      - "127.0.0.1:${AI_SERVER_PORT:-8000}:8000"
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
