name: ai-oncall-agent

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

# Both MCP servers run the mcp-server image; MCP_TOOLSETS decides which tools each serves.
x-mcp-server: &mcp-server
  build: ./mcp-server
  image: ai-oncall-agent-mcp-server
  restart: unless-stopped
  # MCP_USER_ROLES etc. (see mcp-server/.env.example; `make setup` creates it)
  env_file: ./mcp-server/.env
  volumes:
    - ./mcp-server/logs:/app/logs
  healthcheck:
    <<: *healthcheck
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]

services:
  k8s-mcp-server:
    <<: *mcp-server
    environment:
      MCP_TOOLSETS: '["kubernetes"]'
      MCP_AUTH_JWKS_PATH: ""   # MCP tokens: on with the gateway overlay (docker-compose.gateway.yml)
      MCP_SERVER_NAME: oncall-k8s
      MCP_BACKEND: fake
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      MCP_PUBLIC_URL: http://127.0.0.1:${K8S_MCP_PORT:-9000}/mcp
      # agentgateway forwards the Host without a port.
      MCP_ALLOWED_HOSTS: '["k8s-mcp-server", "k8s-mcp-server:*", "localhost:*", "127.0.0.1:*"]'
    ports:
      - "127.0.0.1:${K8S_MCP_PORT:-9000}:9000"

  prometheus-mcp-server:
    <<: *mcp-server
    environment:
      MCP_TOOLSETS: '["prometheus"]'
      MCP_AUTH_JWKS_PATH: ""
      MCP_SERVER_NAME: oncall-prometheus
      MCP_BACKEND: fake
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      MCP_PUBLIC_URL: http://127.0.0.1:${PROMETHEUS_MCP_PORT:-9001}/mcp
      MCP_AUDIT_LOG_PATH: logs/audit-prometheus.jsonl
      MCP_ALLOWED_HOSTS: '["prometheus-mcp-server", "prometheus-mcp-server:*", "localhost:*", "127.0.0.1:*"]'
    ports:
      - "127.0.0.1:${PROMETHEUS_MCP_PORT:-9001}:9000"

  ai-server:
    build: ./ai-server
    restart: unless-stopped
    env_file: ./ai-server/.env
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      MCP_SERVERS: '{"k8s": "http://k8s-mcp-server:9000/mcp", "prometheus": "http://prometheus-mcp-server:9000/mcp"}'
      MCP_TOKEN_PRIVATE_KEY_PATH: ""
    ports:
      - "127.0.0.1:${AI_SERVER_PORT:-8000}:8000"
    depends_on:
      k8s-mcp-server:
        condition: service_healthy
      prometheus-mcp-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
