# Identity of the MCP server: read-only, namespace-scoped, no Secrets/ConfigMaps.
# The tool layer adds finer rules on top; this is the backstop the API server enforces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-server-readonly
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-server-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-server-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-server
