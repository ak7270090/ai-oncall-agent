apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shop

labels:
  - pairs:
      app.kubernetes.io/part-of: shop
    includeSelectors: false
    includeTemplates: true

# One folder per workload: everything about a service sits together.
resources:
  - namespace.yaml
  - user-service/deployment.yaml
  - user-service/service.yaml
  - payment-service/configmap.yaml
  - payment-service/deployment.yaml
  - payment-service/service.yaml
  - order-service/configmap.yaml
  - order-service/deployment.yaml
  - order-service/service.yaml
  - payments-db/deployment.yaml
  - traffic-generator/deployment.yaml
  - prometheus-access.yaml
  # The MCP server's ServiceAccounts (read-only, operator) live with the MCP server.
  - ../../../mcp-platform/server/deploy

secretGenerator:
  - name: payment-service-secrets
    envs:
      - payment-service/secret.env
  - name: payments-db-secrets
    envs:
      - payments-db/secret.env
