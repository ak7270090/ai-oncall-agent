<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="An engineer asks the AI server; the AI server uses an LLM and calls two MCP servers through the MCP gateway; the MCP servers read the Kubernetes cluster and Prometheus" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Engineer -->
  <rect x="30" y="195" width="130" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="95" cy="228" r="12" fill="#7c3aed"/>
  <path d="M73 262 a22 18 0 0 1 44 0 z" fill="#7c3aed"/>
  <text x="95" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#1e1b4b">Engineer</text>
  <text x="95" y="303" text-anchor="middle" font-size="12" fill="#475569">on call</text>

  <!-- AI server group -->
  <rect x="210" y="40" width="240" height="320" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#0c1e4a">AI server</text>
  <text x="330" y="89" text-anchor="middle" font-size="12" fill="#475569">FastAPI · LangGraph</text>

  <rect x="235" y="110" width="190" height="62" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="330" y="137" text-anchor="middle" font-size="14" font-weight="600" fill="#0c1e4a">Investigation workflow</text>
  <text x="330" y="156" text-anchor="middle" font-size="12" fill="#475569">plans the checks</text>

  <rect x="235" y="190" width="190" height="62" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="330" y="217" text-anchor="middle" font-size="14" font-weight="600" fill="#0c1e4a">Model router</text>
  <text x="330" y="236" text-anchor="middle" font-size="12" fill="#475569">fast or strong model per step</text>

  <rect x="235" y="270" width="190" height="62" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="330" y="297" text-anchor="middle" font-size="14" font-weight="600" fill="#0c1e4a">Approvals</text>
  <text x="330" y="316" text-anchor="middle" font-size="12" fill="#475569">a second person must approve</text>

  <!-- LLM -->
  <rect x="235" y="415" width="190" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="445" text-anchor="middle" font-size="15" font-weight="600" fill="#0c1e4a">LLM</text>
  <text x="330" y="465" text-anchor="middle" font-size="12" fill="#475569">any provider</text>
  <line x1="330" y1="364" x2="330" y2="410" stroke="#475569" stroke-width="1.75" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="340" y="392" font-size="12" fill="#475569">LangChain</text>

  <!-- Engineer <-> AI server -->
  <line x1="162" y1="238" x2="205" y2="238" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="183" y="230" text-anchor="middle" font-size="11" fill="#475569">asks</text>
  <line x1="205" y1="275" x2="162" y2="275" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="183" y="293" text-anchor="middle" font-size="11" fill="#475569">report</text>

  <!-- Gateway -->
  <rect x="530" y="170" width="150" height="160" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <path d="M605 188 l20 8 v14 c0 14 -9 22 -20 27 c-11 -5 -20 -13 -20 -27 v-14 z" fill="#d97706"/>
  <path d="M597 210 l6 6 l11 -12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="605" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#451a03">MCP gateway</text>
  <text x="605" y="282" text-anchor="middle" font-size="12" fill="#475569">checks every token</text>
  <text x="605" y="299" text-anchor="middle" font-size="12" fill="#475569">and who may use</text>
  <text x="605" y="316" text-anchor="middle" font-size="12" fill="#475569">which tool</text>

  <line x1="452" y1="250" x2="525" y2="250" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="489" y="241" text-anchor="middle" font-size="11" fill="#475569">MCP</text>
  <text x="489" y="267" text-anchor="middle" font-size="11" fill="#475569">+ token</text>

  <!-- Langfuse -->
  <rect x="530" y="415" width="150" height="70" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="605" y="445" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Langfuse</text>
  <text x="605" y="465" text-anchor="middle" font-size="12" fill="#475569">traces · evals</text>
  <path d="M452 330 H490 V450 H525" fill="none" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
  <text x="496" y="395" font-size="11" fill="#64748b">traces</text>

  <!-- MCP servers group -->
  <rect x="725" y="40" width="220" height="400" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="835" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#431407">MCP servers</text>

  <rect x="740" y="95" width="190" height="120" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <circle cx="835" cy="125" r="15" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <circle cx="835" cy="125" r="4" fill="#ea580c"/>
  <path d="M835 110 v8 M835 132 v8 M820 125 h8 M842 125 h8 M824 114 l6 6 M840 130 l6 6 M846 114 l-6 6 M830 130 l-6 6" stroke="#ea580c" stroke-width="2"/>
  <text x="835" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#431407">Kubernetes MCP</text>
  <text x="835" y="184" text-anchor="middle" font-size="12" fill="#475569">pods · logs · events</text>
  <text x="835" y="201" text-anchor="middle" font-size="12" fill="#475569">deployments · runbooks</text>

  <rect x="740" y="295" width="190" height="120" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <polyline points="815,335 825,322 835,330 845,314 855,320" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="812" y1="338" x2="858" y2="338" stroke="#ea580c" stroke-width="1.5"/>
  <text x="835" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#431407">Prometheus MCP</text>
  <text x="835" y="384" text-anchor="middle" font-size="12" fill="#475569">error rate · latency</text>
  <text x="835" y="401" text-anchor="middle" font-size="12" fill="#475569">CPU</text>

  <path d="M682 220 C710 220 705 155 735 155" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M682 280 C710 280 705 355 735 355" fill="none" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Production group -->
  <rect x="1005" y="40" width="170" height="400" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1090" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#052e16">Production</text>

  <rect x="1020" y="95" width="140" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1090" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#052e16">Kubernetes</text>
  <text x="1090" y="159" text-anchor="middle" font-size="15" font-weight="600" fill="#052e16">cluster</text>
  <text x="1090" y="182" text-anchor="middle" font-size="12" fill="#475569">order · payment</text>
  <text x="1090" y="199" text-anchor="middle" font-size="12" fill="#475569">user · database</text>

  <rect x="1020" y="295" width="140" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1090" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="#052e16">Prometheus</text>
  <text x="1090" y="372" text-anchor="middle" font-size="12" fill="#475569">metrics store</text>

  <line x1="932" y1="155" x2="1015" y2="155" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="975" y="146" text-anchor="middle" font-size="11" fill="#475569">read-only</text>
  <line x1="932" y1="355" x2="1015" y2="355" stroke="#475569" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="975" y="346" text-anchor="middle" font-size="11" fill="#475569">PromQL</text>
  <line x1="1090" y1="292" x2="1090" y2="220" stroke="#94a3b8" stroke-width="1.75" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
  <text x="1098" y="260" font-size="11" fill="#64748b">scrapes</text>
</svg>
